# ─────────────────────────────────────────────────────────────────────────────
# VeroData Retail — Configuracion de analisis estatico (SonarQube CE)
# El escaner debe ejecutarse desde la raiz del repositorio.
# ─────────────────────────────────────────────────────────────────────────────

sonar.projectKey=verodata-retail
sonar.projectName=VeroData Retail
sonar.projectVersion=1.0.0

# ── Fuentes y pruebas ────────────────────────────────────────────────────────
# sources y tests comparten rutas: sonar.test.inclusions es OBLIGATORIO para
# que los archivos *.test.ts se cataloguen unicamente como pruebas.
sonar.sources=client/src,server/src
sonar.tests=client/src,server/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ── Exclusiones ──────────────────────────────────────────────────────────────
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,\
  client/vite.config.*,client/tailwind.config.*,client/postcss.config.*,\
  client/src/vite-env.d.ts,\
  **/*.config.ts,**/*.config.js,**/*.config.cjs

# Archivos que se analizan pero no cuentan para la metrica de cobertura.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# ── Cobertura ────────────────────────────────────────────────────────────────
# La ruta del cliente aun no existe (no hay pruebas de frontend): SonarQube la
# ignora y lo informa con un mensaje INFO, sin romper el analisis.
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

# ── Tipado ───────────────────────────────────────────────────────────────────
sonar.typescript.tsconfigPaths=server/tsconfig.json,client/tsconfig.app.json

sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
