# SonarQube Community Edition para VeroData Retail
# Uso: docker compose -f docker-compose.sonar.yml up -d
# UI:  http://localhost:9000  (admin / admin en el primer arranque)

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: verodata-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    # Community Build. El tag 'lts-community' sigue anclado a la 9.9.8 (2023),
    # cuyo analizador de TypeScript no entiende 'moduleResolution: bundler'.
    # Para actualizar: cambiar la version y ejecutar 'down -v' + 'up -d'.
    image: sonarqube:26.10.0.133078-community
    container_name: verodata-sonar
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Solo para despliegue de un unico nodo (Docker Desktop / WSL).
      # Eliminar en un despliegue productivo.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
